name: Keepalive
on:
  schedule:
    # 每月 1 号 UTC 00:00 自动运行一次，防止触发 60 天不活跃禁用
    - cron: "0 0 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Push empty commit to keep workflows active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep workflows active"
          git push
